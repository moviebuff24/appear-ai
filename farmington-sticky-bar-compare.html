<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticky Bar Comparison</title>
<style>
:root{--ink:#1c1917;--muted:#6b6560;--bg:#f5f5f4;--frame:#1c1917}

body{margin:0;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
h1{font-size:20px;margin:0 0 4px;text-align:center}

<figure><figcaption>With sticky bar</figcaption><div class="phone"><iframe src="farmington-sticky-bar-with-bar.html"></iframe></div></figure>
